<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <h4><i class="fa fa-user-md text-accent"></i> 管理员管理</h4>
      <span class="muted" id="totalInfo"></span>
      <button class="btn btn-sm btn-accent ms-3" id="addAdminBtn" onclick="openAdd()" style="display:none;">
        <i class="fa fa-plus"></i> 新增管理员
      </button>
    </div>

    <div class="filter-bar">
      <input type="text" class="form-control" id="fKeyword" placeholder="账号/姓名搜索" style="min-width:240px;">
      <button class="btn btn-sm btn-accent" onclick="loadList(1)"><i class="fa fa-search"></i> 查询</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="doReset()"><i class="fa fa-refresh"></i> 重置</button>
    </div>

    <div class="table-card">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th style="width:55px;">ID</th>
            <th>账号</th>
            <th>姓名</th>
            <th style="width:100px;">身份</th>
            <th style="width:80px;">状态</th>
            <th style="width:150px;">创建时间</th>
            <th style="width:130px;">操作</th>
          </tr>
        </thead>
        <tbody id="dataBody">
          <tr><td colspan="7" class="loading"><i class="fa fa-spinner fa-spin"></i> 加载中...</td></tr>
        </tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>
  </div>

  <!-- 新增管理员弹窗 -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">新增管理员</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">登录账号 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="aUsername" placeholder="请输入登录账号">
          </div>
          <div class="mb-3">
            <label class="form-label">登录密码 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="aPassword" placeholder="请输入登录密码">
          </div>
          <div class="mb-3">
            <label class="form-label">姓名（选填）</label>
            <input type="text" class="form-control" id="aRealName" placeholder="请输入真实姓名">
          </div>
          <div class="muted fs-13">
            <i class="fa fa-info-circle"></i> 新增管理员默认启用；密码使用 BCrypt 加密存储。
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-accent" id="addBtn" onclick="doAdd()">确 定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/common.js?v=11"></script>
  <script>
    // 进入页面时校验登录态，未登录跳转到登录页
    if (!localStorage.getItem('adminToken')) {
      location.href = '../login.html';
    }
  </script>
  <script>
    var PAGE = { page: 1, size: 10, total: 0 };
    // 当前登录管理员是否为超级管理员（用户名 admin）
    var IS_SUPER = false;
    (function () {
      try {
        var info = JSON.parse(localStorage.getItem('adminInfo') || '{}');
        IS_SUPER = (info.username === 'admin');
      } catch (e) {}
      if (IS_SUPER) {
        $('#addAdminBtn').show();
      }
    })();

    function loadList(p) {
      PAGE.page = p || 1;
      $('#dataBody').html('<tr><td colspan="7" class="loading"><i class="fa fa-spinner fa-spin"></i> 加载中...</td></tr>');
      ajax('/admin/admins', 'GET', { page: PAGE.page, size: PAGE.size, keyword: $.trim($('#fKeyword').val()) }, function (res) {
        PAGE.total = res.total || 0;
        var list = res.records || [];
        var h = '';
        if (!list.length) {
          h = '<tr><td colspan="7" class="empty-tip"><i class="fa fa-inbox"></i> 暂无管理员数据</td></tr>';
        } else {
          list.forEach(function (a) {
            var isAdmin = (a.username === 'admin');
            var role = isAdmin
              ? '<span class="badge bg-warning text-dark">超级管理员</span>'
              : '<span class="badge bg-secondary">普通管理员</span>';
            var badge = a.status === 1
              ? '<span class="badge status-on">正常</span>'
              : '<span class="badge status-off">已禁用</span>';
            var btn = '<span class="muted fs-13">-</span>';
            if (IS_SUPER && !isAdmin) {
              btn = a.status === 1
                ? '<button class="btn btn-sm btn-outline-danger" onclick="toggleStatus(' + a.id + ',0)">禁用</button>'
                : '<button class="btn btn-sm btn-outline-accent" onclick="toggleStatus(' + a.id + ',1)">启用</button>';
            }
            h += '<tr>'
              + '<td class="fs-13">' + a.id + '</td>'
              + '<td>' + esc(a.username) + '</td>'
              + '<td>' + esc(a.realName || '-') + '</td>'
              + '<td>' + role + '</td>'
              + '<td>' + badge + '</td>'
              + '<td class="fs-13">' + fmtTime(a.createTime) + '</td>'
              + '<td>' + btn + '</td>'
              + '</tr>';
          });
        }
        $('#dataBody').html(h);
        $('#totalInfo').text('共 ' + PAGE.total + ' 个管理员');
        renderPager('#pager', PAGE.page, PAGE.size, PAGE.total, function (n) { loadList(n); });
      });
    }

    function doReset() { $('#fKeyword').val(''); loadList(1); }

    function openAdd() {
      $('#aUsername').val('');
      $('#aPassword').val('');
      $('#aRealName').val('');
      $('#addModal').modal('show');
    }

    function doAdd() {
      var username = $.trim($('#aUsername').val());
      var password = $('#aPassword').val();
      if (!username) { alert('请输入登录账号'); return; }
      if (!password) { alert('请输入登录密码'); return; }
      $('#addBtn').prop('disabled', true);
      ajax('/admin/admins', 'POST', { username: username, password: password, realName: $.trim($('#aRealName').val()) }, function () {
        $('#addBtn').prop('disabled', false);
        $('#addModal').modal('hide');
        alert('管理员添加成功');
        loadList(1);
      }, function () {
        $('#addBtn').prop('disabled', false);
      });
    }

    function toggleStatus(id, st) {
      if (!confirm(st === 1 ? '确认启用该管理员？' : '确认禁用该管理员？')) return;
      ajax('/admin/adminStatus/' + id + '/' + st, 'POST', null, function () { loadList(PAGE.page); });
    }

    $('#fKeyword').on('keydown', function (e) { if (e.key === 'Enter') loadList(1); });
    loadList(1);
  </script>
</body>
</html>
